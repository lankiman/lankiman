name: Refresh language charts

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/language-charts.yml'

permissions:
  contents: write

concurrency:
  group: profile-language-charts
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'lankiman/lankiman'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test chart generation
        run: node --test .github/scripts/tests/generate-language-charts.test.mjs
      - name: Generate charts from public repository data
        env:
          PROFILE_USER: lankiman
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-language-charts.mjs
      - name: Commit updated charts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/top-languages.svg assets/top-languages-compact.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh public language charts'
          git push origin HEAD:main
